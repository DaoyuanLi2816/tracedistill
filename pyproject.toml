[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracedistill"
version = "0.2.0"
description = "Distill teacher chains-of-thought into a LoRA adapter via a strict boxed-answer format contract and a two-phase Train→Nudge schedule (silver-medal NVIDIA Nemotron reasoning recipe)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Daoyuan Li" }]
keywords = [
    "lora",
    "chain-of-thought",
    "reasoning",
    "trace-distillation",
    "sft",
    "peft",
    "nemotron",
    "mamba",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy ML stack — only needed to actually train (the core import stays light).
train = [
    "torch>=2.4",
    "transformers>=4.46,<6",
    "trl>=0.12,<2",
    "peft>=0.13,<1",
    "datasets>=2.20,<5",
    "accelerate>=1.0,<2",
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
dev = [
    "build>=1.2",
    "ruff>=0.11",
    "twine>=6",
]

[project.urls]
Homepage = "https://github.com/DaoyuanLi2816/tracedistill"
Documentation = "https://github.com/DaoyuanLi2816/tracedistill/tree/main/docs"
Changelog = "https://github.com/DaoyuanLi2816/tracedistill/blob/main/CHANGELOG.md"
Issues = "https://github.com/DaoyuanLi2816/tracedistill/issues"
Source = "https://github.com/DaoyuanLi2816/tracedistill"

[project.scripts]
tracedistill = "tracedistill.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "competition/training.py",
    "tests/reference_impl.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
