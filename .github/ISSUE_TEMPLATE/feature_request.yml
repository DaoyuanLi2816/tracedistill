name: Feature request
description: Propose a focused, testable improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the API or behavior and how it could be validated.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Data and formatting
        - Training and masking
        - Sampling
        - Model and LoRA compatibility
        - CLI and packaging
        - Evaluation and documentation
    validations:
      required: true
