<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 322" role="img" aria-label="GSM8K boxed-answer accuracy on base Qwen2.5-0.5B: zero-shot 13.0%, answer-only SFT 10.0%, trace-distill one-phase 31.5%, trace-distill two-phase 33.0%.">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#11161f"/>
    </linearGradient>
  </defs>
  <rect width="840" height="322" rx="12" fill="url(#rbg)"/>
  <rect x="0" y="0" width="8" height="322" fill="#76B900"/>

  <text x="32" y="40" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e6edf3">GSM8K boxed-answer accuracy</text>
  <text x="32" y="61" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">base Qwen2.5-0.5B + LoRA · 1200 train / 200 test · one RTX 4080</text>

  <!-- zero-shot baseline gridline at 13.0% -->
  <line x1="363" y1="92" x2="363" y2="250" stroke="#3d444d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="363" y="84" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#6e7681" text-anchor="middle">zero-shot baseline 13.0%</text>

  <!-- bars: scale 8.68 px per %, 0% at x=250 -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
    <!-- zero-shot 13.0 -> 113px -->
    <text x="238" y="113" fill="#c9d1d9" text-anchor="end">zero-shot (base)</text>
    <rect x="250" y="96" width="113" height="26" rx="4" fill="#6e7681"/>
    <text x="371" y="114" fill="#9aa3af">13.0%  ·  parse 33.0%</text>

    <!-- answer-only SFT 10.0 -> 87px -->
    <text x="238" y="157" fill="#c9d1d9" text-anchor="end">answer-only SFT</text>
    <rect x="250" y="140" width="87" height="26" rx="4" fill="#da3633"/>
    <text x="345" y="158" fill="#e09b99">10.0%  ·  parse 100%</text>

    <!-- trace-distill 1 phase 31.5 -> 273px -->
    <text x="238" y="201" fill="#c9d1d9" text-anchor="end">trace-distill · 1 phase</text>
    <rect x="250" y="184" width="273" height="26" rx="4" fill="#4a7c12"/>
    <text x="531" y="202" fill="#9aa3af">31.5%  ·  parse 99.5%</text>

    <!-- trace-distill 2 phase 33.0 -> 286px -->
    <text x="238" y="245" fill="#c9d1d9" text-anchor="end">trace-distill · 2 phase</text>
    <rect x="250" y="228" width="286" height="26" rx="4" fill="#76B900"/>
    <text x="544" y="246" fill="#e6edf3" font-weight="600">33.0%  ·  parse 99.0%</text>
  </g>

  <!-- callout -->
  <line x1="32" y1="276" x2="808" y2="276" stroke="#21262d" stroke-width="1"/>
  <text x="32" y="302" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Trace supervision: <tspan fill="#e6edf3" font-weight="600">31.5–33.0%</tspan> vs <tspan fill="#da8b89" font-weight="600">10.0%</tspan> answer-only · Train → Nudge: ≥5-step <tspan fill="#76B900" font-weight="700">3.0% → 12.1%</tspan></text>
</svg>
